{% extends 'base.html' %}

{% block title %}New Account - Secure Bank Manager{% endblock %}

{% block content %}
<div style="max-width: 1200px; margin: 0 auto;">
    <div style="max-width: 600px; margin: 0 auto;">
        <h1 style="font-size: 24px; font-weight: 400; margin-bottom: 24px;">Open Account</h1>
    <div class="card">
        <div class="card-body">
            <div class="alert alert-info" style="margin-bottom: 24px;">
                Client: <strong>{{ client.full_name }}</strong> ({{ client.cin }})
            </div>

            <form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-4">
                    <label for="opening_amount" class="form-label">Initial deposit (minimum {{ config.MINIMUM_OPENING_BALANCE }} {{ config.CURRENCY }}) *</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="number" step="0.001" class="form-control" id="opening_amount" name="opening_amount"
                               min="{{ config.MINIMUM_OPENING_BALANCE }}" value="{{ config.MINIMUM_OPENING_BALANCE }}" required style="flex: 1;">
                        <span style="padding: 10px 16px; border: 1px solid var(--border); border-radius: 4px; background: var(--background); color: var(--text-secondary);">{{ config.CURRENCY }}</span>
                    </div>
                    <div style="font-size: 12px; color: var(--text-secondary); margin-top: 8px;">
                        The policy service sets the minimum opening balance.
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; margin-top: 32px;">
                    <a href="{{ url_for('clients.view', id=client.id) }}" class="btn">Cancel</a>
                    <button type="submit" class="btn btn-primary">Open Account</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
